
<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minta Maaf ke Kamu 🥺💖</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<body style="background url(jjp.jpeg);
	background-size: fixed;">
	</body>
	<audio autoplay>
        <source src="lagu ini.mp3" type="audio/mpeg"/>
	</audio>


	
	<!-- Step 1: Input name -->
	<div class="card" id="nameCard">
		<h1>Hai Fei 💕</h1>
		<p>Boleh aku tau nama panggilan manis kamu? 🥰</p>
		<input type="text" id="nickname" placeholder="contoh: ayang, beb, panggilan khusus..." />
		<button id="submitName">Lanjut 💌</button>
		
		
	</div>

	<!-- Step 2: Minta maaf -->
	<div class="card" id="apologyCard" style="display: none;">
		<img src="love.gif" alt="GIF romantis" class="gif">

		<h1>Feii cantik, Aku minta maaf yaa 🥺💖</h1>
		<p id="apologyText"> 
			Kehubung kita ga jadi ketemuan mamas cmn bisa ngasih ini walaupun ga seberapa, mamas cuman berpesan kamu adalah cewek hebat yang udah melalui hari yang berat.<br> ade cayang jangan lupa istirahatnyaa yakkk
		</p>
		<div class="btn-group">
			<button id="yesBtn">HARUS SEMANGAT 💖</button>
			<button id="noBtn">Enggak 😠</button>
		</div>
	</div>

	
	<!-- Popup -->
	<div class="popup" id="popup">
		<div class="popup-content">
			<h2 id="popupTitle"></h2>
			<p id="popupMsg"></p>
			<div class="hearts" id="hearts"></div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
